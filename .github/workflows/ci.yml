name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_call:

permissions:
  contents: read

jobs:
  release-guard-tests:
    name: Release guard tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tool -p 'test_*.py'

  analyze-and-test:
    name: Analyze & Test (Flutter ${{ matrix.flutter }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.29.0', '3.47.8']

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Validate example and README snippets
        working-directory: example
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test

      - name: Validate pub.dev publish (dry run)
        run: dart pub publish --dry-run

  wasm-build:
    name: Web (Wasm and shader asset compile)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      # The example app ships without platform folders; generate web in CI.
      - name: Build example for web (Wasm)
        working-directory: example
        run: |
          flutter create --empty --platforms=web --project-name nib_motion_example .
          flutter build web --wasm
          flutter build web --wasm -t lib/demos.dart

  shader-renderer:
    name: Shader renderer tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run shader renderer tests
        run: flutter test --enable-impeller test/shaders
