name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev, 'docs/launch-ready-*']
  workflow_call:

permissions:
  contents: read

jobs:
  release-guard-tests:
    name: Release guard tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -m unittest discover -s tool -p 'test_*.py'

  analyze-and-test:
    name: Analyze & Test (Flutter ${{ matrix.flutter }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.29.0', '3.50.0']

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ matrix.flutter }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: |
          if [ '${{ matrix.flutter }}' = '3.29.0' ]; then
            flutter analyze --fatal-infos
          else
            # Flutter 3.50 deprecates material.dart, which remains necessary at the 3.29 floor.
            flutter analyze --fatal-warnings
          fi

      - name: Check generated Metal shader bindings
        run: python3 tool/check_metal_bindings.py

      - name: Run tests
        run: flutter test --coverage

      - name: Validate example and README snippets
        working-directory: example
        run: |
          flutter pub get
          if [ '${{ matrix.flutter }}' = '3.29.0' ]; then
            flutter analyze --fatal-infos
          else
            flutter analyze --fatal-warnings
          fi
          flutter test

      - name: Validate pub.dev publish (dry run)
        run: dart pub publish --dry-run

  wasm-build:
    name: Web (Wasm and shader asset compile)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Build gallery for web and Wasm
        working-directory: example
        run: |
          flutter pub get
          flutter build web -t lib/demos.dart
          flutter build web --wasm
          flutter build web --wasm -t lib/demos.dart

  shader-renderer:
    name: Shader renderer tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run shader renderer tests
        run: flutter test --enable-impeller test/shaders
