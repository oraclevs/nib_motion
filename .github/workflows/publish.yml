name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: pub-dev-release
  cancel-in-progress: false

jobs:
  release-identity:
    name: Verify release identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a commit merged into main
        run: |
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
      - name: Check tag, changelog, and unpublished version
        run: python3 tool/verify_release.py "$GITHUB_REF_NAME"

  preflight:
    name: Release preflight
    needs: release-identity
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish
    needs: preflight
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # setup-dart provisions pub.dev's OIDC token; Flutter supplies the SDK used below.
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Recheck publication state after preflight and approval
        run: python3 tool/verify_release.py "$GITHUB_REF_NAME"
      - name: Install dependencies
        run: flutter pub get
      - name: Validate publication
        run: dart pub publish --dry-run
      - name: Publish
        run: dart pub publish --force
