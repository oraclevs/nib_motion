name: nib_motion
description: "A declarative, physics-based Flutter animation framework inspired by Framer Motion — springs, gestures, variants, presence, FLIP layout, and GPU shaders."
version: 0.3.1
homepage: https://www.nibmotion.xyz
repository: https://github.com/oraclevs/nib_motion
issue_tracker: https://github.com/oraclevs/nib_motion/issues


environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  shaders:
    - lib/shaders/shimmer.frag
    - lib/shaders/dissolve.frag
    - lib/shaders/gradient_sweep.frag
    - lib/shaders/liquid_glass.frag


