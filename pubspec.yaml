name: nib_motion
description: "A physics-driven motion framework for Flutter: declarative animation, interruptible springs, gestures, shared layouts, scroll-linked values, and GPU effects."
version: 0.3.6
homepage: https://www.nibmotion.xyz
documentation: https://www.nibmotion.xyz/docs/motion/introduction
repository: https://github.com/oraclevs/nib_motion
issue_tracker: https://github.com/oraclevs/nib_motion/issues

topics:
  - animation
  - physics
  - gestures
  - transitions
  - flutter

screenshots:
  - description: 'Interactive Flutter gallery: spring retargeting and layout transitions.'
    path: assets/showcase/nibmotion-showcase.gif
  - description: 'Lagoon: a Flutter app with experimental interactive water refraction.'
    path: assets/showcase/nibmotion-water.gif

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  shaders:
    - lib/shaders/shimmer.frag
    - lib/shaders/dissolve.frag
    - lib/shaders/gradient_sweep.frag
    - lib/shaders/liquid_glass.frag
    - lib/shaders/nav_water.frag
    - lib/shaders/water_material.frag
